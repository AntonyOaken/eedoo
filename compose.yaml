services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: poputi
      POSTGRES_USER: poputi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poputi -d poputi"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks: [backend]
  app:
    image: poputi-app:${POPUTI_IMAGE_TAG:-local}
    pull_policy: never
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [backend]
  tools:
    image: poputi-tools:${POPUTI_IMAGE_TAG:-local}
    pull_policy: never
    env_file: .env
    profiles: [tools]
    volumes: ["./work:/app/work", "./public/photos:/app/public/photos:ro"]
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
    restart: unless-stopped
    networks: [backend]
networks:
  backend:
volumes:
  postgres:
